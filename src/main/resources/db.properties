# Database connection settings.
# In GitHub Codespaces, MySQL runs in a service container reachable at host 'db'.
# useSSL=false avoids the self-signed-cert TLS error; allowPublicKeyRetrieval=true
# avoids the MySQL 8 public-key auth handshake error.
#
# If you ever run MySQL on your OWN local machine instead, change 'db' to 'localhost'.

db.url=jdbc:mysql://db:3306/student_management_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=root1234
db.driver=com.mysql.cj.jdbc.Driver
